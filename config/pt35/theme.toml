# pt35-desktop theme. Sizes are physical pixels on the 640x480 panel.
# User override: ~/.config/pt35/theme.toml, merged over this file key by key.
# Settings > Appearance writes ~/.config/pt35/appearance.toml, which sits
# between the two: a hand edit in theme.toml still wins over a pick.
#
# Mint on charcoal. Terminal green without the neon: a saturated #00ff88 buzzes
# on an emissive panel this small, so the accent is toned down and the text is
# off-white with a green cast. The panel is 3.5" at 640x480, about 9 px/mm, so a
# 50px row is ~5.5mm: readable at arm's length, hittable with a thumb.

[color]
background      = "#0a1310"
background_alt  = "#121f1a"
foreground      = "#dcf3e5"
muted           = "#7aa48e"
accent          = "#3ddc97"
accent_fg       = "#06130d"
warning         = "#e8c468"
critical        = "#ef6b73"
ok              = "#3ddc97"
border          = "#254236"
# tile          = "#1a2620"   # home tiles and panels; unset is background_alt
# clock         = "#d4ffe9"   # home clock and date, with the glow; unset is foreground

# Face-button pills in the hint bar, matching the physical buttons.
button_a        = "#3ddc97"
button_b        = "#ef6b73"
button_x        = "#5fd0e8"
button_y        = "#e8c468"
button_neutral  = "#254236"

[font]
family          = "DejaVu Sans"
# Anything you press is bold: a chip or a legend has to read at a glance, and
# 640x480 gives it fewer pixels than the text it sits next to.
family_bold     = "DejaVu Sans Bold"
family_mono      = "DejaVu Sans Mono"
family_mono_bold = "DejaVu Sans Mono Bold"
family_display   = ""    # big readouts (clocks); empty is family_mono
size_bar        = 15.0
size_menu       = 23.0
size_title      = 24.0
size_hint       = 16.0

[bar]
height        = 34
padding_x     = 10
show_battery  = "auto"   # auto | always | never
show_network  = true
show_volume   = true
show_mode     = true     # the BTN / MOUSE readout
show_clock    = true
clock_format  = "%H:%M"  # strftime; "%-I:%M %p" for 12-hour
# clock_size  = 26.0     # with family_display; unset is size_bar
menu_icon     = "skull"  # skull (the shutter) | bars
dock_labels   = false    # names next to the taskbar icons

[menu]
# 480 - 34 (bar) - 46 (header) - 46 (hints) = 354px of body. pt35-menu
# recomputes this and clamps, so the number here is a ceiling, not a promise.
rows_visible  = 7
row_height    = 50
padding_x     = 14
show_numbers  = true
filter_hint   = "type to search"   # header text while a search is empty
recents       = 5        # launches kept at the top of the launcher, 0 for none
show_desktop_entries = true   # false: only the apps in apps.toml
animations    = true     # selection glide and screen settle, ~0.1s each
type_to_search = true    # typing on the launcher searches; false on stock firmware
window_previews = true   # switcher cards show each window as it last looked
header_height = 46
title_header  = false    # the trail small, the screen title in family_display
hint_height   = 46
radius        = 2
columns       = 3
tile_height   = 86
gap           = 10
scrollbar_width = 8      # also a target: click the track, drag the thumb
launcher_columns = 1     # 2 or more: the launcher is a grid of big icons
launcher_home = false    # with a grid: pinned apps, clock and state widgets
tile_opacity  = 100      # %; below 100 the wallpaper shows through the home
hint_frames   = false    # legend as square keys with framed actions
row_frames    = false    # framed list icons; Quick settings as a full list

[effects]
scanlines     = 0        # CRT lines, % darker; pt35-bar --scanlines covers apps
scanline_period = 2      # one dark line in this many; keep bar height a multiple
glow          = 0        # halo round the home's clock, px
sweep         = 0        # a band of light rolls down every N seconds; 0 off
sweep_jitter  = 0        # up to N seconds more between two, at random
sweep_strength = 8       # % at the band's middle
rain          = 0        # glyphs falling behind the home, % bright; 0 off
rain_speed    = 2        # rows a second, 0-4; Quick settings has the slider

# GTK and Qt apps. dark | light | keep (leave the desktop settings alone).
# Applied through gsettings at login and on reload; Qt follows GTK.
[apps]
color_scheme  = "dark"
gtk_dark      = "Adwaita-dark"
gtk_light     = "Adwaita"

# Papirus is packaged and readable at this size. Anything the theme does not
# have falls back to a letter in a coloured badge.
[icons]
theme         = "Papirus-Dark"
size_bar      = 18
size_tile     = 32
size_launcher = 64       # launcher grid only, see [menu] launcher_columns
glow          = 0        # halo under launcher grid icons, in pixels

# Mouse mode. 16px at 40 repeats a second crosses the 640px panel in a second,
# and still lands on a 24px close button.
[pointer]
step          = 16
repeat_delay  = 200
repeat_rate   = 40
# Bibata: a clear outline on dark and light alike. 20px is a fingertip on this
# panel without covering what it points at.
cursor_theme  = "Bibata-Modern-Classic"
cursor_size   = 20

# Buttons mode. Slower, because one press of the D-pad should move one row.
# `hide_cursor` is milliseconds of stillness; there is no cursor worth keeping
# in this mode.
[buttons]
repeat_delay  = 500
repeat_rate   = 8
hide_cursor   = 1500
